<html>
    <head>
        <title>TaskGuard</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                padding: 16px;
                min-width: 300px;
            }
            h1 {
                font-size: 18px;
                margin-bottom: 16px;
            }
            .section {
                margin-bottom: 16px;
            }
            input[type="text"] {
                width: 100%;
                padding: 8px;
                margin-bottom: 8px;
                box-sizing: border-box;
                border: 1px solid #ccc;
                border-radius: 4px;
            }
            .timer-label {
                font-weight: bold;
                margin-bottom: 8px;
                display: block;
            }
            .timer-buttons {
                display: flex;
                gap: 8px;
                margin-bottom: 8px;
            }
            .timer-btn {
                flex: 1;
                padding: 8px;
                border: 1px solid #007bff;
                background: white;
                color: #007bff;
                border-radius: 4px;
                cursor: pointer;
            }
            .timer-btn.selected {
                background: #007bff;
                color: white;
            }
            .timer-btn:hover {
                background: #0056b3;
                color: white;
            }
            #submit_intent {
                width: 100%;
                padding: 10px;
                background: #28a745;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
                font-size: 14px;
            }
            #submit_intent:hover {
                background: #218838;
            }
            #timer_display {
                text-align: center;
                font-size: 24px;
                font-weight: bold;
                color: #333;
                padding: 8px;
                display: none;
            }
        </style>
    </head>
    <body>
        <h1>TaskGuard</h1>
        <div class="section" id="intent_entry">
            <input type="text" id="intent_input" placeholder="Enter your intent here">
            <input type="text" id="task_description" placeholder="Describe your task">
        </div>
        <div class="section" id="select_timer">
            <span class="timer-label">Focus Duration:</span>
            <div class="timer-buttons">
                <button class="timer-btn" data-minutes="15">15m</button>
                <button class="timer-btn" data-minutes="25">25m</button>
                <button class="timer-btn" data-minutes="45">45m</button>
                <button class="timer-btn" data-minutes="60">60m</button>
            </div>
            <div id="timer_display"></div>
        </div>
        <button id="submit_intent">Start Focus Session</button>
        <script src="blocked.js"></script>
    </body>
</html>
