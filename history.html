<!DOCTYPE html>
<html>
<head>
    <title>TaskGuard - History</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            max-width: 800px;
            margin: 0 auto;
            padding: 24px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        h1 { font-size: 22px; color: #6c5ce7; }
        .header-actions { display: flex; gap: 10px; }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary { background: #6c5ce7; color: white; }
        .btn-primary:hover { background: #5a4bd1; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #2d2d4a;
        }
        .tab {
            padding: 10px 20px;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: #555580;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .tab:hover { color: #9a9abf; }
        .tab.active { color: #6c5ce7; border-bottom-color: #6c5ce7; }

        /* Stats */
        .stats {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            flex: 1;
            background: #1a1a2e;
            border: 1px solid #2d2d4a;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
            color: #6c5ce7;
        }
        .stat-card .label {
            font-size: 12px;
            color: #7a7a9a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a2e;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #2d2d4a;
        }
        th {
            background: #16213e;
            padding: 12px 16px;
            text-align: left;
            font-size: 12px;
            color: #7a7a9a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #2d2d4a;
        }
        td {
            padding: 10px 16px;
            font-size: 13px;
            border-bottom: 1px solid #1f1f3a;
            color: #c0c0d8;
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #16213e; }
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-allow { background: #1a3a2a; color: #00b894; }
        .badge-block { background: #3a1a1a; color: #e74c3c; }
        .badge-timer { background: #1a2a3a; color: #74b9ff; }
        .badge-user { background: #3a3a1a; color: #fdcb6e; }

        .empty-state {
            text-align: center;
            color: #555580;
            padding: 48px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>TaskGuard History</h1>
        <div class="header-actions">
            <button class="btn btn-primary" id="btn_export_json">Export JSON</button>
            <button class="btn btn-primary" id="btn_export_csv">Export CSV</button>
            <button class="btn btn-danger" id="btn_clear">Clear All Data</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" data-tab="decisions">Decisions</button>
        <button class="tab" data-tab="sessions">Sessions</button>
    </div>

    <div id="stats" class="stats"></div>
    <div id="content"></div>

    <script src="history.js"></script>
</body>
</html>
