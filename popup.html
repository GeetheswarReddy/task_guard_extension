<!DOCTYPE html>
<html>
<head>
    <title>TaskGuard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            width: 340px;
            background: #1a1a2e;
            color: #e0e0e0;
        }
        .header {
            background: linear-gradient(135deg, #6c5ce7, #4a3fbf);
            color: white;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header .subtitle { font-size: 11px; opacity: 0.8; margin-top: 2px; }

        /* Setup view */
        .section { padding: 12px 16px; }
        .section label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #9a9abf;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #2d2d4a;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: #16213e;
            color: #e0e0e0;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #6c5ce7; }
        input[type="text"]::placeholder { color: #555580; }
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #2d2d4a;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            background: #16213e;
            color: #e0e0e0;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        select:focus { border-color: #6c5ce7; }

        .timer-buttons {
            display: flex;
            gap: 8px;
        }
        .timer-btn {
            flex: 1;
            padding: 10px 0;
            border: 2px solid #2d2d4a;
            background: #16213e;
            color: #9a9abf;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .timer-btn:hover { border-color: #6c5ce7; color: #6c5ce7; }
        .timer-btn.selected {
            background: #6c5ce7;
            color: white;
            border-color: #6c5ce7;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #00b894;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: #00a381; }
        .btn-primary:disabled { background: #2d2d4a; color: #555; cursor: not-allowed; }

        /* Active session view */
        #active_session { display: none; }
        .session-info {
            background: #16213e;
            border-radius: 8px;
            padding: 14px;
            margin: 0 16px 12px;
            border: 1px solid #2d2d4a;
        }
        .session-info .intent-label {
            font-size: 11px;
            color: #9a9abf;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .session-info .intent-text {
            font-size: 14px;
            font-weight: 600;
            color: #e0e0e0;
            margin-top: 4px;
        }
        .timer-display {
            text-align: center;
            font-size: 48px;
            font-weight: 700;
            color: #6c5ce7;
            padding: 16px 0;
            font-variant-numeric: tabular-nums;
        }
        .session-actions {
            display: flex;
            gap: 8px;
            padding: 0 16px 14px;
        }
        .btn-secondary {
            flex: 1;
            padding: 10px;
            border: 2px solid #6c5ce7;
            background: transparent;
            color: #6c5ce7;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-secondary:hover { background: #6c5ce7; color: white; }
        .btn-danger {
            flex: 1;
            padding: 10px;
            border: none;
            background: #e74c3c;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }
        .btn-danger:hover { background: #c0392b; }

        /* Footer links */
        .footer {
            display: flex;
            justify-content: center;
            gap: 16px;
            padding: 10px 16px;
            border-top: 1px solid #2d2d4a;
            background: #16213e;
        }
        .footer a {
            font-size: 12px;
            color: #6c5ce7;
            text-decoration: none;
            cursor: pointer;
        }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>TaskGuard</h1>
            <div class="subtitle">Stay focused on what matters</div>
        </div>
    </div>

    <!-- Setup View -->
    <div id="setup_view">
        <div class="section">
            <label>What are you working on?</label>
            <input type="text" id="intent_input" placeholder="e.g. Prepare for OS exam">
        </div>
        <div class="section" style="padding-top: 0;">
            <label>Category</label>
            <select id="intent_category">
                <option value="">Select a category...</option>
                <option value="studying">Studying</option>
                <option value="coding">Coding</option>
                <option value="writing">Writing</option>
                <option value="research">Research</option>
                <option value="work">Work</option>
                <option value="design">Design</option>
                <option value="reading">Reading</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="section" style="padding-top: 0;">
            <label>Task details (optional)</label>
            <input type="text" id="task_description" placeholder="e.g. Study chapters 5-7">
        </div>
        <div class="section" style="padding-top: 0;">
            <label>Focus duration</label>
            <div class="timer-buttons">
                <button class="timer-btn" data-minutes="15">15m</button>
                <button class="timer-btn" data-minutes="25">25m</button>
                <button class="timer-btn" data-minutes="45">45m</button>
                <button class="timer-btn" data-minutes="60">60m</button>
            </div>
        </div>
        <div class="section" style="padding-top: 0;">
            <button class="btn-primary" id="start_session">Start Focus Session</button>
        </div>
    </div>

    <!-- Active Session View -->
    <div id="active_session">
        <div style="padding-top: 12px;">
            <div class="session-info">
                <div class="intent-label">Current Task</div>
                <div class="intent-text" id="current_intent"></div>
            </div>
            <div class="timer-display" id="timer_display">00:00</div>
        </div>
        <div class="session-actions">
            <button class="btn-secondary" id="btn_allowlist">Manage Allowlist</button>
            <button class="btn-danger" id="end_session">End Session</button>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <a id="link_allowlist">Allowlist</a>
        <a id="link_export">Export Data</a>
        <a id="link_history">History</a>
    </div>

    <script src="popup.js"></script>
</body>
</html>
